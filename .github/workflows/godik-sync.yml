name: GODIK Sync upstream

# Every 6 hours: pick up Ken's newest app release tag (v<version> on
# KenKaiii/gg-framework) that GODIK CODER hasn't shipped yet, merge it into
# main (my changes stay on top), check that our session-manager.ts patch still
# applies, then push main, tag the merge godik-v<version>, create its GitHub
# release and start godik-release.yml to build and upload into it.
# Anything that fails before the push leaves main and the tags untouched.
# Merge conflict: fix it locally with ./sync-upstream, push, and re-run.
#
# dry_run (manual runs only): skip the merge and instead prove this workflow's
# token can create a release on a pushed tag, on a throwaway prerelease + tag
# that are deleted again.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only prove release creation on a throwaway tag"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: godik-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: "Dry run: push a throwaway tag, create its release, delete both"
        if: inputs.dry_run == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Same calls as the real path below (tag push, then release create
          # with --verify-tag). Marked prerelease and never "latest", so the
          # app's update endpoint (releases/latest) can't point at it.
          tag="godik-dryrun-${GITHUB_RUN_ID}"
          git tag "$tag"
          git push origin "$tag"
          trap 'gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes 2>/dev/null || true; git push origin ":refs/tags/$tag" || true' EXIT
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "GODIK CODER dry run (deleted again)" --notes "Throwaway release from godik-sync dry_run."
          echo "DRY RUN OK: this workflow's token created release $tag on an existing tag."

      - name: Find Ken's newest unshipped app tag
        if: inputs.dry_run != true
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/KenKaiii/gg-framework.git
          git fetch --tags upstream
          # Ken's app tags are v0.x.y on commits that set tauri.conf.json's
          # version to the same number. Old v4.x tags are CLI packages: skipped
          # by that version check. Newest by tag date, not by number.
          pick=""
          for tag in $(git tag -l 'v[0-9]*' --sort=-creatordate); do
            v="${tag#v}"
            conf="$(git show "$tag:gg-app/src-tauri/tauri.conf.json" 2>/dev/null | node -p 'try{JSON.parse(require("fs").readFileSync(0,"utf8")).version}catch{""}')"
            [[ "$conf" == "$v" ]] || continue
            pick="$tag"
            break
          done
          [[ -n "$pick" ]] || { echo "No upstream app tag found" >&2; exit 1; }
          echo "Newest upstream app tag: $pick"
          if git rev-parse -q --verify "refs/tags/godik-$pick" >/dev/null; then
            echo "Already shipped as godik-$pick; nothing to do."
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$pick" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge into main (local only)
        if: steps.pick.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "godik-sync[bot]"
          git config user.email "godik-sync@users.noreply.github.com"
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "main already contains $TAG."
          elif ! git merge --no-edit "$TAG" -m "Merge Ken's $TAG into GODIK CODER"; then
            echo "::error::Merge conflict with $TAG in: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            echo "Fix locally: cd godik-coder && ./sync-upstream, resolve, push main, then re-run this workflow." >&2
            git merge --abort
            exit 1
          fi
          conf="$(node -p 'require("./gg-app/src-tauri/tauri.conf.json").version')"
          [[ "v$conf" == "$TAG" ]] || { echo "::error::After merge tauri.conf.json is $conf but tag is $TAG"; exit 1; }

      - uses: pnpm/action-setup@v6
        if: steps.pick.outputs.tag != ''

      - uses: actions/setup-node@v7
        if: steps.pick.outputs.tag != ''
        with:
          node-version: 22.x
          cache: pnpm

      - name: Check our Ken-turn patch still holds after the merge
        if: steps.pick.outputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @kenkaiiii/gg-ai build
          pnpm --filter @kenkaiiii/gg-agent build
          pnpm --filter @kenkaiiii/gg-core build
          cd packages/ggcoder
          if ! pnpm exec vitest run src/core/ken-turn-anchor.test.ts; then
            echo "::error::ken-turn-anchor.test.ts fails after merging ${{ steps.pick.outputs.tag }}. Ken may have fixed the Ken-turn anchor drift upstream: our patch in packages/ggcoder/src/core/session-manager.ts (mapCustomEntriesInFileOrder, repairedCountAfter) should then be dropped. main was NOT pushed and nothing was tagged."
            exit 1
          fi

      - name: Push main, tag and create the release
        if: steps.pick.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin main
          git tag "godik-$TAG"
          git push origin "godik-$TAG"
          echo "Tagged godik-$TAG"
          # tauri-action finds this release by tagName and only uploads to it;
          # creating it there failed with "Resource not accessible by integration".
          if gh release view "godik-$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release godik-$TAG already exists."
          else
            gh release create "godik-$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "GODIK CODER $TAG" \
              --notes "GODIK CODER: Ken's GG Coder $TAG plus my changes. macOS Apple Silicon; ad-hoc signed, not notarized."
          fi

      - name: Start the release build
        if: steps.pick.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        # -R is required: with the upstream remote added above, gh would
        # otherwise guess Ken's repo and 404.
        run: gh workflow run godik-release.yml -R "$GITHUB_REPOSITORY" --ref "godik-$TAG"
